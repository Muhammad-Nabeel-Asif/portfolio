about:
  - >-
    I started in 2021 turning Figma files into React pages, and kept moving toward the parts
    of a product that have to be right: payments, sign-in, the data model, the jobs that run
    while nobody is watching.
  - >-
    These days most of my work is AI agents, which mostly means building what surrounds the
    model: what it is allowed to touch, where it has to stop and ask, and how to tell
    afterwards why it did what it did.
  - >-
    I like owning a product from the first client meeting to the release, and I have done it
    both leading a team and as the only engineer. I build with Claude Code and Cursor every
    day, with checks around them so that speed never costs quality.

